<!DOCTYPE html>
<html lang="en" class="is-loading">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Booth | Saurabh Dhiman</title>
  <meta name="description"
    content="Step into Saurabh Dhiman's virtual DJ booth. Mix on the decks or run the visuals on the LED wall, right in your browser." />
  <!-- staging under /new: keep it out of search until it replaces the live site -->
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#050404" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/base.css" />
  <link rel="stylesheet" href="../src/css/booth.css" />
  <link rel="stylesheet" href="../src/css/console.css" />
  <link rel="stylesheet" href="../src/css/world.css" />
  <link rel="icon" type="image/png" href="/favicon.png">
</head>

<body class="booth-page" data-mode="gate">
  <div class="loader" id="loader" role="status" aria-label="Loading">
    <div class="loader-deck" aria-hidden="true">
      <div class="loader-disc"><span class="loader-label"></span></div>
      <span class="loader-arm"></span>
    </div>
    <p class="loader-pct" id="loaderPct">0%</p>
  </div>

  <canvas id="world" aria-label="3D DJ booth. Choose the DJ or VJ console."></canvas>

  <header class="bt-bar">
    <a class="bt-back" id="backToSite" href="/new/#booth-preview">← Site</a>
    <nav class="bt-tabs" aria-label="Booth views">
      <button data-go="overview">Booth</button>
      <button data-go="dj">DJ</button>
      <button data-go="vj">VJ</button>
    </nav>
    <button class="sound-toggle" id="soundToggle" aria-pressed="false" aria-label="Play music" title="Play music">
      <svg class="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" />
        <g class="sound-waves">
          <path d="M15.5 8.5a5 5 0 0 1 0 7" />
          <path d="M18.5 5.5a9 9 0 0 1 0 13" />
        </g>
        <g class="sound-mute">
          <path d="m16 9 6 6M22 9l-6 6" />
        </g>
      </svg>
      <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </button>
    <a class="btn btn-red btn-small" href="/new/#book">Book</a>
  </header>

  <div class="hotspots">
    <button class="hotspot" data-go="dj"><span>Play the music</span></button>
    <button class="hotspot" data-go="vj"><span>Play the visuals</span></button>
  </div>

  <div class="gate" id="gate">
    <h1>The Booth</h1>
    <p>Saurabh's decks on the left, the visuals desk on the right. Mix the music, run the LED wall, or both.</p>
    <button class="btn btn-red btn-large" id="enterBooth">Step in<span class="btn-icon is-play" aria-hidden="true"><svg
          viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5.5v13l10.5-6.5z" />
        </svg></span></button>
    <p class="gate-small">Sound on. Best in landscape on phones.</p>
  </div>

  <section class="panel compact" id="booth" data-panel="dj" aria-label="DJ console" hidden>
    <div class="console" id="console">
      <div class="deck" data-deck="A"></div>
      <div class="mixer" id="mixer"></div>
      <div class="deck" data-deck="B"></div>
    </div>
    <div class="pads" id="pads"></div>
  </section>

  <section class="panel compact" data-panel="vj" aria-label="VJ console" hidden>
    <div class="vj-controls" id="vjControls"></div>
    <p class="panel-hint">Your visuals play on the LED wall. Tap the wall to cut to the next scene.</p>
  </section>

  <div class="rotate" id="rotate" hidden>
    <div class="rotate-phone" aria-hidden="true"><span></span></div>
    <p>Rotate your phone for the full booth</p>
    <button class="btn btn-ghost btn-small" id="stayPortrait">Stay in portrait</button>
  </div>

  <script type="module" src="../src/booth-main.js"></script>
</body>

</html>
